<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance Tracker prototype</title>
<style>
/* TOKENS:START */
/* Finance Tracker design tokens.
   Source of truth for colour, type, spacing, radius, shadow and chart palette.
   design/prototype/index.html inlines this file verbatim (between the TOKENS markers);
   rebuild with design/prototype/sync-tokens.sh after editing. */

:root {
  color-scheme: light;

  /* Surfaces: the pale green of passbook and cheque paper, with white slips on top */
  --bg: #e9f0eb;
  --surface: #fbfcfa;
  --surface-2: #e0e8e3;
  --surface-3: #d2dcd6;
  --line: #d0dad4;
  --line-strong: #aebbb4;
  --scrim: rgba(18, 28, 25, 0.48);

  /* Ink */
  --ink: #17201d;
  --ink-2: #47524e;
  --ink-3: #55605b;
  --ink-inverse: #fbfcfa;

  /* Brand: lagoon teal. Kaya gold marks "now"; orange belongs to charts (expenses), not to chrome */
  --brand: #0b5d53;
  --brand-hover: #094c44;
  --on-brand: #ffffff;
  --accent: #009180;
  --accent-soft: #d9efe9;
  --warm: #eb6834;
  --warm-soft: #fde5d8;
  --gold: #f2c14e;
  --gold-soft: #fbefcd;
  --deep: #0c4a43;
  --on-deep: #f3f7f4;

  /* Meaning (always paired with an icon or a word) */
  --pos: #0a6b3c;
  --pos-soft: #dcefe2;
  --neg: #b3331c;
  --neg-soft: #fbe2db;
  --warn: #855600;
  --warn-soft: #fbefcd;
  --focus: #1f6fe0;

  /* Chart palette: categorical, fixed order, validated for colour-blind separation on --surface */
  --s1: #009180; /* teal: income, kept, single-series default */
  --s2: #eb6834; /* orange: expenses, dining */
  --s3: #2a78d6; /* blue: housing */
  --s4: #eda100; /* yellow: transport */
  --s5: #e87ba4; /* magenta: shopping */
  --s6: #008300; /* green: groceries */
  --s7: #6250d6; /* violet: travel */
  --s8: #e34948; /* red: bills and subscriptions */
  --s-other: #8d9a94; /* neutral: other, context series */
  /* Sequential ramp (calendar heatmap): one hue, more is darker */
  --seq-0: #e0e8e3;
  --seq-1: #cfeae3;
  --seq-2: #9bd6c9;
  --seq-3: #55b9a7;
  --seq-4: #14907f;
  --seq-5: #0a5e54;
  --grid: #e2e9e4;
  --axis: #aebbb4;

  /* Type: system stack only, no web fonts */
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --fs-2xs: 11px;
  --fs-xs: 12px;
  --fs-sm: 13px;
  --fs-md: 15px;
  --fs-lg: 17px;
  --fs-xl: 20px;
  --fs-2xl: 26px;
  --fs-3xl: 34px;
  --fs-4xl: 46px;
  --fs-5xl: 60px;
  --lh-tight: 1.12;
  --lh-snug: 1.3;
  --lh-body: 1.5;
  --fw-regular: 400;
  --fw-medium: 550;
  --fw-bold: 680;

  /* Spacing: 4 px base */
  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 20px;
  --sp-6: 24px;
  --sp-8: 32px;
  --sp-10: 40px;
  --sp-12: 48px;
  --sp-16: 64px;

  /* Radius */
  --r-xs: 6px;
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* Shadow */
  --sh-1: 0 1px 0 rgba(18, 33, 29, 0.05);
  --sh-2: 0 6px 20px -8px rgba(18, 33, 29, 0.18), 0 1px 2px rgba(18, 33, 29, 0.06);
  --sh-3: 0 24px 60px -20px rgba(20, 30, 26, 0.38), 0 2px 6px rgba(20, 30, 26, 0.1);

  /* Motion and targets */
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur: 180ms;
  --tap: 44px;
}

[data-theme="dark"] {
  color-scheme: dark;

  --bg: #0d1614;
  --surface: #15211e;
  --surface-2: #1c2b27;
  --surface-3: #243631;
  --line: #273833;
  --line-strong: #3a4f49;
  --scrim: rgba(2, 8, 6, 0.66);

  --ink: #eef2ec;
  --ink-2: #b9c5bf;
  --ink-3: #93a29c;
  --ink-inverse: #0d1614;

  --brand: #62d6c1;
  --brand-hover: #7ee2cf;
  --on-brand: #06231f;
  --accent: #19a391;
  --accent-soft: #173b35;
  --warm: #d95926;
  --warm-soft: #43261a;
  --gold: #f2c14e;
  --gold-soft: #3d3317;
  --deep: #103f39;
  --on-deep: #f3f7f4;

  --pos: #5fd08f;
  --pos-soft: #173524;
  --neg: #ff9a80;
  --neg-soft: #43231b;
  --warn: #f2c14e;
  --warn-soft: #3d3317;
  --focus: #8ab8ff;

  /* Same eight hues, re-stepped for the dark surface and validated again */
  --s1: #19a391;
  --s2: #d95926;
  --s3: #3987e5;
  --s4: #c98500;
  --s5: #d55181;
  --s6: #008300;
  --s7: #9085e9;
  --s8: #e66767;
  --s-other: #7d8a85;
  --seq-0: #1c2b27;
  --seq-1: #17443d;
  --seq-2: #176256;
  --seq-3: #1b8473;
  --seq-4: #35ad98;
  --seq-5: #7fe0cc;
  --grid: #223430;
  --axis: #3a4f49;

  --sh-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --sh-2: 0 8px 24px -10px rgba(0, 0, 0, 0.6), 0 1px 2px rgba(0, 0, 0, 0.3);
  --sh-3: 0 28px 70px -20px rgba(0, 0, 0, 0.75), 0 2px 6px rgba(0, 0, 0, 0.4);
}
/* TOKENS:END */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-md);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
a{color:var(--brand);text-underline-offset:3px}
svg{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:var(--r-xs)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--brand);color:var(--on-brand);padding:10px 14px;border-radius:var(--r-sm);z-index:99}
.skip:focus{top:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- primitives ---------- */
.num{font-variant-numeric:tabular-nums}
.amt{transition:filter var(--dur) var(--ease)}
.priv .amt{filter:blur(7px);user-select:none}
.eyebrow{font-size:var(--fs-sm);font-weight:var(--fw-medium);color:var(--ink-3)}
.muted{color:var(--ink-3)}
.ink2{color:var(--ink-2)}
.small{font-size:var(--fs-sm)}
.xs{font-size:var(--fs-xs)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.row{display:flex;align-items:center;gap:var(--sp-3)}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:var(--sp-3)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.ic.lg{width:24px;height:24px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:var(--tap);padding:0 var(--sp-5);border-radius:var(--r-pill);font-weight:var(--fw-medium);font-size:var(--fs-md);white-space:nowrap;border:1px solid transparent;transition:background var(--dur) var(--ease),transform var(--dur) var(--ease),border-color var(--dur)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hover)}
.btn.ghost{border-color:var(--line-strong);background:var(--surface);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.quiet{color:var(--brand);padding:0 var(--sp-3)}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.danger{background:var(--neg);color:var(--ink-inverse)}
.btn.danger-ghost{border-color:var(--neg);color:var(--neg);background:transparent}
.btn.sm{min-height:36px;padding:0 var(--sp-4);font-size:var(--fs-sm)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);border-radius:var(--r-pill);color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn.on{background:var(--accent-soft);color:var(--brand)}
.iconbtn.txt{font-size:var(--fs-sm);font-weight:var(--fw-bold);width:auto;min-width:var(--tap);padding:0 10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--sp-5);min-width:0}
.card h3{font-size:var(--fs-lg);font-weight:var(--fw-bold);line-height:var(--lh-snug);letter-spacing:-.01em}
.card .sub{font-size:var(--fs-sm);color:var(--ink-3);margin-top:2px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-2);font-size:var(--fs-xs);font-weight:var(--fw-medium);white-space:nowrap}
.chip.teal{background:var(--accent-soft);color:var(--brand)}
.chip.warm{background:var(--warm-soft);color:var(--neg)}
.chip.gold{background:var(--gold-soft);color:var(--warn)}
.chip.line{background:transparent;border:1px solid var(--line-strong)}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-pill);padding:3px;gap:2px;max-width:100%}
.seg button{min-height:36px;padding:0 14px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:var(--fw-medium);color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.seg.fill{display:flex}.seg.fill button{flex:1;justify-content:center;padding:0 8px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span,.label{font-size:var(--fs-sm);font-weight:var(--fw-medium);color:var(--ink-2)}
.input,.select{min-height:var(--tap);width:100%;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 var(--sp-3);font-size:16px}
.select{appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.select.sm{min-height:36px;font-size:var(--fs-sm);width:auto;border-radius:var(--r-pill);padding-left:14px}
.input:hover,.select:hover{border-color:var(--ink-3)}
.hint{font-size:var(--fs-xs);color:var(--ink-3)}
.switch{position:relative;width:52px;height:32px;border-radius:var(--r-pill);background:var(--line-strong);flex:none;transition:background var(--dur)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);transition:transform var(--dur) var(--ease)}
.switch[aria-checked=true]{background:var(--accent)}
.switch[aria-checked=true]::after{transform:translateX(20px)}
.av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:var(--fs-sm);font-weight:var(--fw-bold);flex:none;color:var(--ink);background:color-mix(in srgb,var(--avc,var(--s-other)) 22%,var(--surface))}
.av.sm{width:32px;height:32px;border-radius:10px;font-size:var(--fs-xs)}
.meter{height:8px;border-radius:var(--r-pill);background:var(--accent-soft);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:var(--r-pill);background:var(--accent)}
.divide>*+*{border-top:1px solid var(--line)}
.note{display:flex;gap:var(--sp-3);padding:var(--sp-4);border-radius:var(--r-md);background:var(--gold-soft);color:var(--ink);font-size:var(--fs-sm)}
.note.teal{background:var(--accent-soft)}
.note .ic{color:var(--warn);margin-top:1px}.note.teal .ic{color:var(--brand)}

/* ---------- app shell ---------- */
.demo{display:flex;align-items:center;gap:var(--sp-3);padding:6px var(--sp-4);background:var(--ink);color:var(--bg);font-size:var(--fs-xs);min-height:36px}
.demo b{color:var(--gold)}
.demo button{margin-left:auto;color:var(--bg);text-decoration:underline;text-underline-offset:3px;min-height:28px;white-space:nowrap}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 36px)}
.side{position:sticky;top:0;height:100vh;padding:var(--sp-5) var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-1);border-right:1px solid var(--line);overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:var(--fw-bold);font-size:var(--fs-lg);letter-spacing:-.02em;padding:0 var(--sp-3) var(--sp-5)}
.logo svg{width:32px;height:32px;flex:none}
.nav{display:flex;align-items:center;gap:var(--sp-3);min-height:42px;padding:0 var(--sp-3);border-radius:var(--r-sm);color:var(--ink-2);font-weight:var(--fw-medium);font-size:var(--fs-md);text-decoration:none;width:100%}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current=page]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1);border:1px solid var(--line)}
.nav[aria-current=page] .ic{color:var(--accent)}
.nav .count{margin-left:auto;font-size:var(--fs-2xs);font-weight:var(--fw-bold);background:var(--warm);color:#fff;border-radius:var(--r-pill);padding:1px 7px}
.nav-sep{font-size:var(--fs-xs);color:var(--ink-3);padding:var(--sp-4) var(--sp-3) var(--sp-1)}
.side-foot{margin-top:auto;padding:var(--sp-3);border-radius:var(--r-md);background:var(--surface-2);font-size:var(--fs-xs)}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-8);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.top h1{font-size:var(--fs-xl);font-weight:var(--fw-bold);letter-spacing:-.02em;margin-right:auto;min-width:0}
.top .logo{padding:0;display:none}
.page{padding:var(--sp-2) var(--sp-8) var(--sp-16);max-width:1240px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-5)}
.page-h p{color:var(--ink-2);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--sp-5)}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.tabbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .top{padding:var(--sp-2) var(--sp-3) var(--sp-2) var(--sp-4);gap:0}
  .top h1{font-size:var(--fs-lg)}
  .page{padding:var(--sp-2) var(--sp-4) 120px}
  .grid{gap:var(--sp-4)}
  .c12,.c8,.c7,.c6,.c5,.c4{grid-column:span 12}
  .card{padding:var(--sp-4)}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;font-size:10.5px;font-weight:var(--fw-medium);color:var(--ink-3);text-decoration:none;border-radius:var(--r-sm)}
  .tabbar [aria-current=page]{color:var(--brand)}
  .tabbar .fab{background:var(--brand);color:var(--on-brand);width:50px;height:50px;border-radius:18px;justify-self:center;box-shadow:var(--sh-2)}
  .hide-m{display:none!important}
}
@media (min-width:861px){.hide-d{display:none!important}}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;justify-content:flex-end;animation:fade var(--dur) var(--ease)}
.sheet{background:var(--surface);width:min(460px,100%);height:100%;overflow:auto;padding:var(--sp-6);box-shadow:var(--sh-3);animation:slideL 240ms var(--ease);display:flex;flex-direction:column;gap:var(--sp-4)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.sheet-h h2{font-size:var(--fs-xl);font-weight:var(--fw-bold);letter-spacing:-.02em}
.sheet-f{margin-top:auto;display:flex;gap:var(--sp-3);padding-top:var(--sp-4);position:sticky;bottom:calc(-1 * var(--sp-6));background:var(--surface);padding-bottom:var(--sp-2)}
.scrim.center{align-items:center;justify-content:center;padding:var(--sp-4)}
.dialog{background:var(--surface);border-radius:var(--r-xl);padding:var(--sp-6);width:min(440px,100%);box-shadow:var(--sh-3);display:flex;flex-direction:column;gap:var(--sp-4);max-height:90vh;overflow:auto}
.dialog h2{font-size:var(--fs-xl);font-weight:var(--fw-bold);letter-spacing:-.02em;line-height:var(--lh-snug)}
@media (max-width:860px){
  .scrim{align-items:flex-end}
  .sheet{width:100%;height:auto;max-height:92vh;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:var(--sp-5) var(--sp-4);animation:slideU 260ms var(--ease)}
  .sheet::before{content:"";width:40px;height:4px;border-radius:4px;background:var(--line-strong);align-self:center;flex:none;margin-top:-8px}
  .sheet-f{bottom:calc(-1 * var(--sp-5))}
}
@keyframes fade{from{opacity:0}}
@keyframes slideL{from{transform:translateX(40px);opacity:0}}
@keyframes slideU{from{transform:translateY(60px);opacity:0}}
@keyframes rise{from{transform:translateY(10px);opacity:0}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:var(--r-pill);font-size:var(--fs-sm);font-weight:var(--fw-medium);z-index:80;box-shadow:var(--sh-3);display:flex;gap:var(--sp-3);align-items:center;max-width:calc(100vw - 32px);animation:rise 220ms var(--ease)}
.toast button{color:var(--gold);font-weight:var(--fw-bold);text-decoration:underline;white-space:nowrap}
@media (max-width:860px){.toast{bottom:92px}}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:var(--r-sm);font-size:var(--fs-xs);box-shadow:var(--sh-2);max-width:240px;line-height:1.35}
.tip b{display:block;font-size:var(--fs-sm)}
.tip .k{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.menu{position:absolute;right:var(--sp-4);top:40px;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--sh-3);padding:var(--sp-2);width:min(300px,calc(100vw - 32px));color:var(--ink);max-height:80vh;overflow:auto}
.menu button{display:flex;align-items:center;gap:var(--sp-2);width:100%;min-height:38px;padding:0 var(--sp-3);border-radius:var(--r-xs);font-size:var(--fs-sm);text-decoration:none;color:var(--ink)}
.menu button:hover{background:var(--surface-2)}
.menu .nav-sep{padding-top:var(--sp-3)}

/* ---------- charts ---------- */
.chart text{font-family:var(--font);fill:var(--ink-3);font-size:11px}
.chart .lab{fill:var(--ink);font-size:12px;font-weight:550}
.chart .val{fill:var(--ink-2);font-size:12px}
.chart .gridl{stroke:var(--grid);stroke-width:1}
.chart .axisl{stroke:var(--axis);stroke-width:1}
.chart [data-tip]{cursor:pointer;transition:opacity var(--dur)}

const fd=(s,wd)=>{const d=dt(s);return S.lang==='zh'?`${d.getMonth()+1}月${d.getDate()}日${wd?' 週'+WD_ZH[d.getDay()]:''}`:`${wd?WD_EN[d.getDay()]+' ':''}${d.getDate()} ${MO_EN[d.getMonth()]}`};
const mName=(m,short)=>{const[y,mm]=m.split('-').map(Number);return S.lang==='zh'?(short?`${mm}月`:`${y}年${mm}月`):(short?MO_EN[mm-1]:`${MO_FULL[mm-1]} ${y}`)};
const mWord=m=>{const mm=Number(m.split('-')[1]);return S.lang==='zh'?`${mm}月`:MO_FULL[mm-1]};
const prevM=m=>{const d=dt(m);d.setMonth(d.getMonth()-1);return iso(d).slice(0,7)};

const TX=()=>S.empty?S.txEmpty:DB.tx;
const sum=l=>l.reduce((a,t)=>a+t.sgd,0);
const inM=(l,m)=>l.filter(t=>t.d.startsWith(m));
const exps=l=>l.filter(t=>!t.inc), incs=l=>l.filter(t=>t.inc);

const pct=(a,b)=>b?Math.round((a-b)/b*100):0;

const av=(t,sm)=>`<span class="av ${sm?'sm':''}" style="--avc:${cc(t.c)}" aria-hidden="true">${initials(t.m)}</span>`;
const daysBetween=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
function monthStats(m){const tx=inM(TX(),m),E=sum(exps(tx)),In=sum(incs(tx));return{tx,E,In,net:In-E,n:exps(tx).length}}
/* spend up to the same day-of-month, for a fair comparison with a month in progress */
function toDay(m,day){return sum(exps(inM(TX(),m)).filter(t=>Number(t.d.slice(8))<=day))}
function forecast(){ /* month-end forecast for the current month */
  const tx=exps(inM(TX(),CURM)),spent=sum(tx),day=Number(TODAY.slice(8)),left=dim(CURM)-day;
  const recNames=new Set(RECUR.map(r=>r.m));

  const due=RECUR.filter(r=>r.day>day).reduce((a,r)=>a+(r.rise?r.rise.a:r.a)/RATES[r.cur],0);
  const perDay=variable/day;
  return{spent,due,perDay,left,total:spent+due+perDay*left}}
function recurring(){ /* each recurring charge with last amount, change and next date */
  const day=Number(TODAY.slice(8));
  return RECUR.map(r=>{const hist=TX().filter(t=>t.m===r.m).sort((a,b)=>a.d<b.d?-1:1);if(!hist.length)return null;const lastT=hist[hist.length-1],prevT=hist[hist.length-2];

/* ============ charts (inline SVG, values in display currency) ============ */
const vw=()=>window.innerWidth, mob=()=>vw()<=860;

/* cumulative spend: this month against the month before, with a dashed forecast */
function paceChart(m,w,h,tone){

  const cum=(mo,to)=>{const by=new Array(to+1).fill(0);for(const t of exps(inM(TX(),mo))){const d=Number(t.d.slice(8));if(d<=to)by[d]+=t.sgd}let a=0;return by.slice(1).map(v=>D(a+=v))};
  const a=cum(m,lastDay),b=cum(pm,dim(pm)),fc=isCur?D(forecast().total):null;
  const max=nice(Math.max(a[a.length-1]||0,b[b.length-1]||0,fc||0)*1.04),pl=2,pr=tone==='hero'?74:70,pt=14,pb=22;
  const X=d=>pl+(d-1)/(days-1)*(w-pl-pr),Y=v=>pt+(1-v/max)*(h-pt-pb);
  const path=arr=>arr.map((v,i)=>`${i?'L':'M'}${X(i+1).toFixed(1)} ${Y(v).toFixed(1)}`).join('');
  const cA=tone==='hero'?'var(--gold)':'var(--s1)',cB=tone==='hero'?'rgba(246,241,228,.5)':'var(--s-other)',ring=tone==='hero'?'var(--deep)':'var(--surface)';
  const id='c'+(chn++);CH[id]={x0:X(1),dx:(w-pl-pr)/(days-1),n:days,names:[mName(m,1),mName(pm,1)],colors:[cA,cB],rows:Array.from({length:days},(_,i)=>({t:T(`Day ${i+1}`,`第 ${i+1} 天`),v:[a[i]!=null?ftd(a[i],{dec:0}):'–',b[i]!=null?ftd(b[i],{dec:0}):'–']}))};
  let s=svgO(w,h,T(`Cumulative spending in ${mName(m)} against ${mName(pm)}`,`${mName(m)}與${mName(pm)}累計支出比較`),`data-ch="${id}"`)+yAxis(max,pl,w-pr,pt,h-pb,2);
  for(const d of [1,8,15,22,29])if(d<=days)s+=`<text x="${X(d)}" y="${h-5}" text-anchor="${d===1?'start':'middle'}" class="num">${d}</text>`;
  s+=`<path d="${path(b)}" fill="none" stroke="${cB}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(a.length){
    s+=`<path d="${path(a)}L${X(a.length)} ${Y(0)}L${X(1)} ${Y(0)}Z" fill="${cA}" opacity=".1"/><path d="${path(a)}" fill="none" stroke="${cA}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;

    else s+=`<text x="${ex+8}" y="${ey+4}" class="lab num">${ftd(a[a.length-1],{compact:1})}</text>`;
    s+=`<circle cx="${ex}" cy="${ey}" r="5" fill="${cA}" stroke="${ring}" stroke-width="2"/>`;
    const by=Y(b[b.length-1]);if(!fc||Math.abs(by-Y(fc))>26)s+=`<text x="${X(dim(pm))+8}" y="${by+4}" class="num">${ftd(b[b.length-1],{compact:1})}</text>`;

/* money flow: income sources → income → categories and what was kept */

/* generic single-series columns (supports negatives) */

/* donut: at most five parts plus Other, gaps not strokes */
function donut(items,size=168){
  const tot=items.reduce((a,p)=>a+p.v,0)||1,r=size/2-4,ri=r*.64,c=size/2;let a0=-Math.PI/2,s=svgO(size,size,items.map(p=>p.label).join(', '),`style="max-width:${size}px"`);
  const P=(rad,a)=>`${(c+rad*Math.cos(a)).toFixed(2)} ${(c+rad*Math.sin(a)).toFixed(2)}`;
  items.forEach(p=>{const a1=a0+p.v/tot*Math.PI*2,g=items.length>1?.018:0,x0=a0+g,x1=Math.max(a1-g,x0+.001),big=x1-x0>Math.PI?1:0;
    if(p.v/tot>=.9999)s+=`<circle cx="${c}" cy="${c}" r="${(r+ri)/2}" fill="none" style="stroke:${p.col}" stroke-width="${r-ri}"/>`;
    else s+=`<path d="M${P(r,x0)}A${r} ${r} 0 ${big} 1 ${P(r,x1)}L${P(ri,x1)}A${ri} ${ri} 0 ${big} 0 ${P(ri,x0)}Z" style="fill:${p.col}" ${tipA(ft(p.v)+', '+Math.round(p.v/tot*100)+'%',p.label)}/>`;a0=a1});
  return s+`<text x="${c}" y="${c-2}" text-anchor="middle" class="lab num" style="font-size:17px;font-weight:680">${ft(tot,{compact:1})}</text><text x="${c}" y="${c+15}" text-anchor="middle">${T('total','合計')}</text></svg>`}

/* small: stepped price history */

  hist.forEach((t,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(vals[i])}" r="${i===hist.length-1?5:3.5}" style="fill:var(--s8);stroke:var(--bg)" stroke-width="2"/><text x="${X(i)}" y="${h-4}" text-anchor="${i?'middle':'start'}">${mName(t.d.slice(0,7),1)}</text>`});

function txFiltered(){const f=S.txf,q=S.txq.trim().toLowerCase();return TX().filter(t=>(f.type==='all'||(f.type==='inc')===t.inc)&&(f.cat==='all'||t.c===f.cat)&&(f.cur==='all'||t.cur===f.cur)&&(f.src==='all'||t.src===f.src)&&(f.month==='all'||t.d.startsWith(f.month))&&(!q||t.m.toLowerCase().includes(q)||cn(t.c).toLowerCase().includes(q)||String(t.a).includes(q)))}
function txRow(t){return`<button class="tx" data-act="txedit" data-arg="${t.id}">${av(t)}<span style="min-width:0"><span class="trunc" style="display:block;font-weight:var(--fw-medium)">${esc(t.m)}</span><span class="meta"><i class="dot" style="background:${cc(t.c)}"></i><span class="trunc">${cn(t.c,1)}</span><span class="hide-m">${T(...SRC[t.src])}</span></span></span><span class="a ${t.inc?'pos':''}">${t.inc?'+':''}${mh(t.sgd)}${t.cur!==S.cur?`<small>${orig(t)}</small>`:''}</span></button>`}
function txList(){const l=txFiltered(),E=sum(exps(l)),In=sum(incs(l));
  if(!l.length)return`<div class="card">${empty('search',T('No transactions match','沒有符合的交易'),T('Try a shorter search, or clear the filters.','試試較短的關鍵字，或清除篩選條件。'),`<button class="btn ghost" data-act="txclear">${T('Clear search and filters','清除搜尋與篩選')}</button>`)}</div>`;
  const shown=l.slice(0,S.txLimit);let s='',last='';
  for(const t of shown){if(t.d!==last){const day=exps(l.filter(x=>x.d===t.d));s+=`<div class="day-h"><span>${fd(t.d,1)}</span><span>${day.length?mh(sum(day)):''}</span></div>`;last=t.d}s+=txRow(t)}
  return`<p class="small ink2" style="margin-bottom:var(--sp-3)" aria-live="polite">${T(`${l.length} transactions, ${mh(E)} spent${In?`, ${mh(In)} received`:''}`,`${l.length} 筆交易，支出 ${mh(E)}${In?`，收入 ${mh(In)}`:''}`)}</p>

    return{cfg,fig:mh(tot),text:T(`on dining in Japan in September: ${tx.length} meals, <span class="amt num">${fmtv(jpy,'JPY')}</span> in yen. The biggest was ${big.m} on ${fd(big.d)}, <span class="amt num">${fmtv(big.a,'JPY')}</span>.`,`是你 9 月在日本的餐飲支出：共 ${tx.length} 餐，日圓原幣 <span class="amt num">${fmtv(jpy,'JPY')}</span>。最高的一筆是 ${fd(big.d)}的 ${big.m}，<span class="amt num">${fmtv(big.a,'JPY')}</span>。`),how:[T('Category: Dining','類別：餐飲'),T('Paid in JPY','以日圓付款'),T('1 to 30 Sep 2026','2026 年 9 月 1 日至 30 日'),T(`${tx.length} transactions`,`${tx.length} 筆交易`)]}}
  if(key==='subs'){const cfg={type:'bar',measure:'spending',group:'merchant',period:'m0',size:2,f:{cat:'bills'},title:T('Bills and subscriptions by merchant','各商家的帳單與訂閱'),pinned:1},rec=recurring().filter(r=>r.c==='bills').sort((a,b)=>b.sgd-a.sgd),tot=sum(rec)*12;
    return{fig:mh(tot,{dec:0}),text:T(`a year for your ${rec.length} bills and subscriptions at current prices. ${rec[0].m} is the largest at ${mh(rec[0].sgd*12,{dec:0})} a year, then ${rec[1].m} at ${mh(rec[1].sgd*12,{dec:0})}.`,`是你 ${rec.length} 筆帳單與訂閱以目前價格計算的一年總額。最高的是 ${rec[0].m}，一年 ${mh(rec[0].sgd*12,{dec:0})}，其次是 ${rec[1].m}，一年 ${mh(rec[1].sgd*12,{dec:0})}。`),
      chart:rec.slice(0,6).map(r=>`<div class="bar-row"><span class="trunc small">${r.m}</span><span class="num small">${mh(r.sgd*12,{dec:0})}</span><span class="track"><i style="width:${r.sgd/rec[0].sgd*100}%;background:var(--s8)"></i></span></div>`).join(''),cfg,how:[T('Category: Bills & subscriptions','類別：帳單與訂閱'),T('Latest monthly price × 12','最近一次月費 × 12'),T(`${rec.length} recurring charges`,`${rec.length} 筆定期扣款`)]}}
  if(key==='grab'){const cfg={type:'bar',measure:'spending',group:'month',period:'m3',size:2,f:{m:'Grab'},title:T('Grab rides by month','每月 Grab 車資'),pinned:1},tx=TX().filter(t=>t.m==='Grab'&&t.d>='2026-08'),tot=sum(tx);
    return{cfg,fig:mh(tot),text:T(`on Grab rides from August to October so far, across ${tx.length} trips. That is about ${mh(tot/tx.length)} a ride. GrabFood orders are counted under Dining, not here.`,`是你 8 月到 10 月至今的 Grab 車資，共 ${tx.length} 趟，平均每趟約 ${mh(tot/tx.length)}。GrabFood 訂單算在餐飲，不包含在內。`),how:[T('Merchant: Grab','商家：Grab'),T('1 Aug to 24 Oct 2026','2026 年 8 月 1 日至 10 月 24 日'),T(`${tx.length} transactions`,`${tx.length} 筆交易`)]}}
  if(key==='groceries'){const cfg={type:'line',measure:'spending',group:'month',period:'m6',size:2,f:{cat:'groceries'},title:T('Groceries by month','每月生鮮雜貨'),pinned:1},v=m=>sum(TX().filter(t=>t.c==='groceries'&&t.d.startsWith(m))),a=v('2026-05'),b=v(CURM),more=b>a;

function slides(){const m=prevM(CURM),pm=prevM(m),s=monthStats(m),p=monthStats(pm),cats=group(exps(s.tx),t=>t.c),pc=group(exps(p.tx),t=>t.c),top=cats[0];
  const diffs=EXPCATS.map(k=>({k,d:(cats.find(c=>c.k===k)||{v:0}).v-(pc.find(c=>c.k===k)||{v:0}).v})).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)),ch=diffs[0];
  const news=recurring().filter(r=>r.from===m),curs=[...new Set(exps(s.tx).map(t=>t.cur))];
  const avg3=k=>MONTHS.slice(1,4).reduce((a,x)=>a+sum(exps(inM(TX(),x)).filter(t=>t.c===k)),0)/3;
  const watch=['dining','groceries','transport','shopping','other'].map(k=>({k,v:(cats.find(c=>c.k===k)||{v:0}).v,a:avg3(k)})).sort((a,b)=>(b.v-b.a)-(a.v-a.a))[0];
  const bar=`<div style="display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden">${cats.map(c=>`<i style="flex:${c.v};background:${cc(c.k)}"></i>`).join('')}</div>`;
  return[
   {bg:'#0c4a43',h:`<div><div class="kick">${T('Month in review','月度回顧')}</div><h2 style="font-size:44px;margin-top:10px">${mName(m)}</h2></div><p>${T('Six cards, about a minute. Swipe, tap the sides, or use the arrow keys.','六張卡片，大約一分鐘。可以滑動、點兩側，或用方向鍵。')}</p>`},
   {bg:'#f2c14e',ink:'#17201d',h:`<div><div class="kick">${T('You spent','你花了')}</div><div class="huge">${m0(s.E)}</div><p>${T(`across ${s.n} payments in ${curs.length} currencies.`,`共 ${s.n} 筆，使用 ${curs.length} 種幣別。`)}</p></div><div class="panel"><b>${s.E>p.E?'+':'−'}${mh(Math.abs(s.E-p.E),{dec:0})}</b> ${T(`against ${mWord(pm)}, ${Math.abs(pct(s.E,p.E))}% ${s.E>p.E?'more':'less'}`,`（與${mWord(pm)}相比${s.E>p.E?'增加':'減少'} ${Math.abs(pct(s.E,p.E))}%）`)}</div>`},
   {bg:'#173f73',h:`<div><div class="kick">${T('Biggest category','最大類別')}</div><h2 style="margin-top:8px">${cn(top.k)}</h2><div class="huge">${m0(top.v)}</div><p>${T(`${Math.round(top.v/s.E*100)}% of everything you spent.`,`占總支出的 ${Math.round(top.v/s.E*100)}%。`)}</p></div><div class="panel">${bar}<div style="margin-top:10px;font-size:13px">${cats.slice(0,4).map(c=>`${cn(c.k,1)} ${Math.round(c.v/s.E*100)}%`).join(T(', ','、'))}</div></div>`},
   {bg:'#3d2f9e',h:`<div><div class="kick">${T('Biggest change','變化最大')}</div><h2 style="margin-top:8px">${cn(ch.k)}</h2><div class="huge">${ch.d>0?'+':'−'}${m0(Math.abs(ch.d))}</div><p>${T(`against ${mWord(pm)}.`,`（與${mWord(pm)}相比）`)} ${ch.k==='travel'?T('Six days in Tokyo will do that.','在東京待六天就是這樣。'):''}</p></div>${ch.k==='travel'?`<div class="panel">${T('Paid in yen','以日圓支付')}: <b><span class="amt num">${fmtv(exps(s.tx).filter(t=>t.cur==='JPY').reduce((a,t)=>a+t.a,0),'JPY')}</span></b></div>`:''}`},
   {bg:'#fbfcfa',ink:'#17201d',h:`<div><div class="kick">${T('New subscriptions','新增的訂閱')}</div><h2 style="margin-top:8px">${news.length?T(`${news.length} started in ${mWord(m)}`,`${mWord(m)}新增 ${news.length} 筆`):T('None this month','這個月沒有')}</h2></div><div>${news.map(r=>`<div class="panel" style="background:#e0e8e3;display:flex;justify-content:space-between;gap:12px"><b>${r.m}</b><span>${mh(r.sgd)} ${T('a month','/ 月')}</span></div>`).join('')}<p style="margin-top:14px">${news.length?T(`That adds ${mh(sum(news)*12,{dec:0})} a year.`,`一年會多出 ${mh(sum(news)*12,{dec:0})}。`):''}</p></div>`},
   {bg:'#8f2f17',h:`<div><div class="kick">${T('One thing to watch','值得留意')}</div><h2 style="margin-top:8px">${cn(watch.k)}</h2><div class="huge">${m0(watch.v)}</div><p>${watch.v>watch.a?T(`${mh(watch.v-watch.a,{dec:0})} above your average for June to August.`,`比 6 至 8 月的平均多 ${mh(watch.v-watch.a,{dec:0})}。`):T('In line with your average for June to August.','與 6 至 8 月的平均相當。')}</p></div><div class="panel">${T('Average for June to August','6 至 8 月平均')}: <b>${mh(watch.a,{dec:0})}</b></div>`},
   {bg:'#0c4a43',h:`<div><h2 style="font-size:38px">${T(`That was ${mWord(m)}.`,`這就是你的 ${mWord(m)}。`)}</h2><p style="margin-top:12px">${T(`${m0(s.In)} in, ${m0(s.E)} out, ${m0(Math.abs(s.net))} ${s.net>=0?'kept':'over'}.`,`收入 ${m0(s.In)}，支出 ${m0(s.E)}，${s.net>=0?'留下':'超支'} ${m0(Math.abs(s.net))}。`)}</p></div><div class="stack"><button class="btn block" data-act="storyopen">${T(`Open the ${mWord(m)} overview`,`開啟${mWord(m)}總覽`)}</button><button class="btn alt block" data-act="story" data-arg="0">${T('Watch again','再看一次')}</button></div>`}]}

function gmailPage(){const f=(ic,b,s,no)=>`<div class="fact ${no?'no':''}"><div class="fi">${I(ic)}</div><div><b>${b}</b><span>${s}</span></div></div>`;

  <p class="lede">${T('Finance Tracker asks to read your mail so it can find what you bought. Here is exactly what that covers.','Finance Tracker 需要讀取你的郵件，才能找出你買了什麼。以下是這個權限的確切範圍。')}</p>

    ${f('eye',T('It can read, and nothing else','只能讀取，不能做其他事'),T('It cannot send, delete, move or label any email.','無法寄信、刪除、移動或標記任何郵件。'))}
    ${f('search',T('It looks for receipts, invoices and renewal notices','只找收據、發票與續訂通知'),T('It searches for those and reads only the matches.','只搜尋這些郵件，並只讀取符合的那些。'))}
    ${f('list',T('It keeps four things from each one','每封只保留四項資料'),T('Merchant, amount, currency and date. The emails are never copied or stored.','商家、金額、幣別與日期。郵件本身不會被複製或儲存。'))}

    ${f('x',T('You can stop it at any time','隨時可以停止'),T('Disconnect in Settings and the reading stops at once. Deleting your account removes everything.','在「設定」中斷連結後會立刻停止讀取。刪除帳戶會移除所有資料。'),1)}</div>
  <div class="gmock"><div class="gw">${I('alert')}${T('Google will show a warning on the next screen','下一個畫面 Google 會顯示警告')}</div>
    <p style="margin-top:6px" class="ink2">${T('It says "Google hasn\'t verified this app". That is expected: Google\'s review is a paid process meant for public apps, and Finance Tracker is an invite-only project for at most 100 people. To carry on:','內容是「Google 尚未驗證這個應用程式」。這是預期中的情況：Google 的審核是針對公開應用程式的付費流程，而 Finance Tracker 是最多 100 人的邀請制專案。繼續的方法：')}</p>
    <ol><li>${T('Choose <kbd>Advanced</kbd>','點選 <kbd>進階</kbd>')}</li><li>${T('Choose <kbd>Go to Finance Tracker</kbd>','點選 <kbd>前往 Finance Tracker</kbd>')}</li><li>${T('Check that the only permission listed is <kbd>Read your email</kbd>, then allow it','確認列出的權限只有 <kbd>讀取你的電子郵件</kbd>，再按允許')}</li></ol></div>
  <div class="stack"><a class="btn primary block" href="#/scan" data-act="startscan">${T('Continue to Google','前往 Google')}</a><a class="btn ghost block" href="#/overview" data-act="skipgmail">${T('Skip for now','先跳過')}</a>
  <p class="hint" style="text-align:center">${T('Skipping is fine. Statement upload and manual entry work without Gmail, and you can connect it later in Settings.','跳過也沒關係。不連結 Gmail 也能上傳對帳單和手動記錄，之後可以在「設定」中連結。')}</p></div>`)}
function scanInner(){const p=Math.min(100,S.scan),done=p>=100,r=52,c=2*Math.PI*r,emails=Math.round(1284*p/100),found=Math.round(212*p/100);
  const st=(t,at)=>`<div class="${p>=at?'done':''}">${p>=at?I('check'):`<svg class="ic ${p>at-34?'spin':''}" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/></svg>`}<span>${t}</span></div>`;
  return`<h1>${done?T(`${found} purchases found`,`找到 ${found} 筆消費`):T('Reading your receipts','正在讀取你的收據')}</h1>
  <p class="lede">${done?T('None of them is saved yet. Review them one by one, or accept them all and adjust later.','這些都還沒儲存。你可以逐筆確認，或全部接受之後再調整。'):T('The first scan covers the last 12 months and takes about two minutes. You can leave this page; it carries on.','第一次掃描涵蓋過去 12 個月，大約需要兩分鐘。可以離開這個頁面，掃描會繼續進行。')}</p>
  <svg class="ring" viewBox="0 0 132 132" role="img" aria-label="${p}%"><circle cx="66" cy="66" r="${r}" fill="none" style="stroke:var(--accent-soft)" stroke-width="10"/><circle cx="66" cy="66" r="${r}" fill="none" style="stroke:var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 66 66)"/><text x="66" y="64" text-anchor="middle" style="font:680 26px var(--font);fill:var(--ink)">${found}</text><text x="66" y="84" text-anchor="middle" style="font:12px var(--font);fill:var(--ink-3)">${T('found','已找到')}</text></svg>
  <p class="small ink2" style="text-align:center" aria-live="polite">${T(`${emails.toLocaleString()} of 1,284 matching emails read`,`已讀取 ${emails.toLocaleString()} / 1,284 封符合的郵件`)}</p>
  <div class="scanlist">${st(T('Searching for receipts, invoices and renewal notices','搜尋收據、發票與續訂通知'),20)}${st(T('Reading merchant, amount, currency and date','讀取商家、金額、幣別與日期'),70)}${st(T('Sorting into categories and spotting subscriptions','分類並找出訂閱'),100)}</div>
  ${done?`<div class="stack"><button class="btn primary block" data-act="scandone" data-arg="review">${T(`Review ${found} finds`,`確認這 ${found} 筆`)}</button><button class="btn ghost block" data-act="scandone" data-arg="all">${T('Accept all and open my dashboard','全部接受並開啟儀表板')}</button></div>`:`<a class="btn ghost block" href="#/overview">${T('Carry on in the background','在背景繼續')}</a>`}`}
const scanPage=()=>flowWrap(5,`<div id="scanbox" class="stack" style="gap:var(--sp-5)">${scanInner()}</div>`);
const FLOWS={landing:landingPage,invite:invitePage,full:fullPage,signin:signinPage,onboard:onboardPage,gmail:gmailPage,scan:scanPage};

/* ============ overlays ============ */
function overlayHtml(){const o=S.overlay;if(!o)return'';const still=S._ov?'still':'';
  if(o.kind==='confirm'){const del=o.what==='delete';return`<div class="scrim center ${still}" data-act="scrim"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="ov-title">
    <h2 id="ov-title">${del?T('Delete your account and all data?','要刪除帳戶與所有資料嗎？'):T('Disconnect Gmail?','要中斷 Gmail 連結嗎？')}</h2>
    <p class="ink2">${del?T(`This removes ${TX().length} transactions, ${S.dashes.length} dashboards, your insights and the Gmail connection. It cannot be undone.`,`這會移除 ${TX().length} 筆交易、${S.dashes.length} 個儀表板、你的洞察以及 Gmail 連結，而且無法復原。`):T('Finance Tracker stops reading your mail straight away. Transactions you already imported stay, and you can reconnect whenever you like.','Finance Tracker 會立刻停止讀取你的郵件。已匯入的交易會保留，之後隨時可以重新連結。')}</p>
    ${del?`<label class="field"><span>${T('Type DELETE to confirm','請輸入 DELETE 以確認')}</span><input class="input" data-on="delc" autocomplete="off" autocapitalize="characters"></label>`:''}
    <div class="row wrap" style="justify-content:flex-end"><button class="btn ghost" data-act="close">${del?T('Keep my account','保留帳戶'):T('Keep connected','保持連結')}</button><button class="btn danger" id="delbtn" data-act="${del?'dodelete':'gmailoff'}" ${del?'disabled':''}>${del?T('Delete everything','全部刪除'):T('Disconnect Gmail','中斷 Gmail 連結')}</button></div></div></div>`}
  const inner=o.kind==='tx'?txSheet(o):o.kind==='chart'?chartSheet(o):`<div class="sheet-h"><h2 id="ov-title">${T('More','更多')}</h2><button class="iconbtn" data-act="close" aria-label="${T('Close','關閉')}">${I('x')}</button></div><nav>${NAV().map(n=>`<a class="nav" href="#/${n[0]}" style="min-height:48px" ${n[0]===route()?'aria-current="page"':''}>${I(n[1])}<span>${n[2]}</span></a>`).join('')}</nav>`;
  return`<div class="scrim ${still}" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ov-title">${inner}</div></div>`}

/* ============ render ============ */
const root=document.getElementById('app'),tipEl=document.getElementById('tip'),toastEl=document.getElementById('toast');
const keyOf=el=>el&&el!==document.body?(el.id?'#'+el.id:el.dataset&&(el.dataset.act||el.dataset.on)?`[data-${el.dataset.act?'act':'on'}="${el.dataset.act||el.dataset.on}"]${el.dataset.arg!=null?`[data-arg="${el.dataset.arg}"]`:''}`:null):null;
function render(){
  const key=keyOf(document.activeElement),r=route();
  for(const k in CH)delete CH[k];chn=0;
  document.documentElement.dataset.theme=S.theme;document.documentElement.lang=S.lang==='zh'?'zh-Hant':'en';document.body.classList.toggle('priv',S.priv);
  document.title=(FLOWS[r]?'':((NAV().find(n=>n[0]===r)||[])[2]||'')+' · ')+'Finance Tracker';
  root.innerHTML=(FLOWS[r]?FLOWS[r]():shell(r))+overlayHtml();
  tipEl.hidden=true;
  if(S.overlay&&!S._ov){const f=root.querySelector('.sheet input,.sheet select,.dialog input,.dialog button,.sheet a');f&&f.focus({preventScroll:true})}
  else if(key){try{const el=root.querySelector(key);el&&el.focus({preventScroll:true})}catch(e){}}
  S._ov=!!S.overlay;document.body.style.overflow=S.overlay?'hidden':'';
  const tr=document.getElementById('track');if(tr){tr.scrollLeft=S.story*tr.clientWidth;tr.addEventListener('scroll',()=>{const i=Math.round(tr.scrollLeft/tr.clientWidth);if(i!==S.story){S.story=i;root.querySelectorAll('.prog i').forEach((e,k)=>e.classList.toggle('on',k<=i))}},{passive:true})}
  if(r==='scan'&&S.scan<100&&!scanT)scanT=setInterval(()=>{S.scan+=2;const b=document.getElementById('scanbox');if(!b||S.scan>=100){clearInterval(scanT);scanT=null}if(b)b.innerHTML=scanInner()},130)}
let scanT=null,toastT=null,lastFocus=null;
function toast(msg,act,label){toastEl.innerHTML=`<span>${msg}</span>${act?`<button data-act="${act}">${label}</button>`:''}`;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.hidden=true},6000)}
const openOv=o=>{lastFocus=keyOf(document.activeElement);S.overlay=o;render()};
const closeOv=()=>{S.overlay=null;S.menu=false;render();if(lastFocus){try{const el=root.querySelector(lastFocus);el&&el.focus()}catch(e){}}};
const blank=()=>({a:'',cur:'SGD',m:'',d:TODAY,c:'dining',inc:false});
let nextId=100000;
function addTx(d,src){const t={id:nextId++,d:d.d,m:d.m,c:d.c,a:Number(d.a),cur:d.cur,sgd:Math.round(Number(d.a)/RATES[d.cur]*100)/100,src:src||'m',inc:!!d.inc};TX().push(t);sortTx();return t}
const sortTx=()=>TX().sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:b.id-a.id);
let undo=null;
function removeTx(id){const l=TX(),i=l.findIndex(t=>t.id===id);if(i<0)return;undo=l.splice(i,1)[0];toast(T(`Deleted ${undo.m}`,`已刪除 ${undo.m}`),'undo',T('Undo','復原'))}

/* ============ actions ============ */
const ACT={
  lang(){S.lang=S.lang==='en'?'zh':'en';render()},setlang(a){S.lang=a;render()},
  theme(){S.theme=S.theme==='dark'?'light':'dark';render()},settheme(a){S.theme=a;render()},
  priv(){S.priv=!S.priv;render()},
  menu(){S.menu=!S.menu;render()},
  goto(a){S.menu=false;S.overlay=null;if(a==='scan')S.scan=0;if(route()===a)render();else go(a)},
  toggle(a){S[a]=!S[a];S.menu=false;S.day=null;render()},
  skip(_,el,e){e.preventDefault();document.getElementById('main').focus()},
  month(a){const i=MONTHS.indexOf(S.month)+Number(a);if(MONTHS[i]){S.month=MONTHS[i];S.day=null;render()}},
  day(a){S.day=a;render()},
  table(a){S.tables[a]=!S.tables[a];render()},
  txcat(a){S.txf={type:'all',cat:a,cur:'all',src:'all',month:S.month};S.txq='';go('transactions')},
  txmer(a){S.txf={type:'all',cat:'all',cur:'all',src:'all',month:S.month};S.txq=a;go('transactions')},
  txnew(){openOv({kind:'tx',id:null,draft:blank()})},
  txedit(a){const t=TX().find(x=>x.id===Number(a));if(t)openOv({kind:'tx',id:t.id,draft:{a:t.a,cur:t.cur,m:t.m,d:t.d,c:t.c,inc:t.inc}})},
  txtype(a){const d=S.overlay.draft;d.inc=a==='1';d.c=d.inc?'salary':'dining';render()},
  txsave(){const o=S.overlay,d=o.draft,a=Number(d.a);
    if(!(a>0)){o.err=T('Enter an amount greater than zero.','請輸入大於零的金額。');return render()}
    if(!String(d.m).trim()){o.err=T('Enter who the payment was to.','請輸入付款對象。');return render()}
    let msg;
    if(o.id){const t=TX().find(x=>x.id===o.id),catCh=t.c!==d.c,oldM=t.m;
      if(catCh&&o.past)TX().forEach(x=>{if(x.m===oldM)x.c=d.c});
      Object.assign(t,{a,cur:d.cur,m:d.m.trim(),d:d.d,c:d.c,inc:!!d.inc,sgd:Math.round(a/RATES[d.cur]*100)/100});sortTx();
      msg=catCh?T(`Saved. ${oldM} goes under ${cn(d.c)} from now on.`,`已儲存。之後 ${oldM} 都會歸到「${cn(d.c)}」。`):T('Changes saved','變更已儲存')}
    else{addTx({...d,m:d.m.trim()},o.src);if(o.rev)S.review=S.review.filter(r=>r.id!==o.rev);msg=T('Transaction added','已新增交易')}
    closeOv();toast(msg)},
  txdel(){const id=S.overlay.id;closeOv();removeTx(id);render()},
  undo(){if(undo){TX().push(undo);sortTx();undo=null;toastEl.hidden=true;render()}},
  txmore(){S.txLimit+=40;render()},
  txclear(){S.txq='';S.txf={type:'all',cat:'all',cur:'all',src:'all',month:'all'};render()},
  close(){closeOv()},scrim(_,el,e){if(e.target===el)closeOv()},
  more(){openOv({kind:'more'})},
  insoff(a){S.insOff[a]=1;render();toast(T('Insight dismissed','已略過這則洞察'))},
  insreset(){S.insOff={};render()},
  dupfix(a){S.insOff.dup=1;removeTx(Number(a));render()},
  imptab(a){S.impTab=a;if(route()!=='import')go('import');else render()},
  impstage(a){S.impStage=Number(a);if(a==='0')S.pwOk=false;render();if(a==='3')toast(T('Import finished. The files were not kept.','匯入完成，檔案沒有被保留。'))},
  pw(){S.pwOk=true;render();toast(T('Unlocked OCBC_360_Account_Oct2026.pdf','已解鎖 OCBC_360_Account_Oct2026.pdf'))},
  revok(a){const r=S.review.find(x=>x.id===a);S.review=S.review.filter(x=>x.id!==a);if(r.notice)toast(T(`${r.m} will show under Recurring when it is charged`,`${r.m} 扣款後會顯示在定期扣款`));else{addTx(r,'g');toast(T(`${r.m} added to your transactions`,`${r.m} 已加入交易`))}render()},
  revno(a){const r=S.review.find(x=>x.id===a);S.review=S.review.filter(x=>x.id!==a);render();toast(T(`${r.m} rejected. It will not be suggested again.`,`已拒絕 ${r.m}，之後不會再建議。`))},
  revedit(a){const r=S.review.find(x=>x.id===a);openOv({kind:'tx',id:null,rev:r.id,src:'g',draft:{a:r.a,cur:r.cur,m:r.m,d:r.d>TODAY?TODAY:r.d,c:r.c,inc:false}})},
  revall(){const n=S.review.length;S.review.forEach(r=>{if(!r.notice)addTx(r,'g')});S.review=[];render();toast(T(`${n} accepted`,`已接受 ${n} 筆`))},
  rescan(){toast(T('Scanned mail since 09:12. Nothing new.','已掃描 09:12 之後的郵件，沒有新發現。'))},
  dash(a){S.dash=Number(a);render()},
  dashnew(){S.dashes.push({name:T('Untitled dashboard','未命名儀表板'),w:[]});S.dash=S.dashes.length-1;S.edit=true;render()},
  edit(){S.edit=!S.edit;render();if(!S.edit)toast(T('Dashboard saved','儀表板已儲存'))},
  chartnew(){openOv({kind:'chart',idx:null,cfg:{type:'bar',measure:'spending',group:'category',period:'m0',size:2}})},
  chartedit(a){openOv({kind:'chart',idx:Number(a),cfg:{...S.dashes[S.dash].w[Number(a)]}})},
  cfg(a){const[k,v]=a.split(':'),c=S.overlay.cfg;c[k]=k==='size'?Number(v):v;if(c.type==='line')c.group='month';if(!c.pinned)delete c.title;render()},
  chartsave(){const o=S.overlay,w=S.dashes[S.dash].w;if(o.idx==null)w.push(o.cfg);else w[o.idx]=o.cfg;closeOv();toast(o.idx==null?T('Chart added','已新增圖表'):T('Chart saved','圖表已儲存'))},
  wmove(a){const[i,d]=a.split(':').map(Number),w=S.dashes[S.dash].w,j=i+d;if(j<0||j>=w.length)return;[w[i],w[j]]=[w[j],w[i]];render();const b=root.querySelector(`[data-act="wmove"][data-arg="${j}:${d}"]:not([disabled])`)||root.querySelector(`[data-act="wmove"][data-arg="${j}:${-d}"]`);b&&b.focus()},
  wsize(a){const c=S.dashes[S.dash].w[Number(a)];c.size=c.size%4+1;render()},
  wdel(a){const w=S.dashes[S.dash].w;w.splice(Number(a),1);render();toast(T('Chart removed','已移除圖表'))},
  ask(a){ask(ASK_Q().find(q=>q[0]===a)[1],a)},
  pin(a){const q=S.asks[Number(a)];q.pinned=1;S.dashes[0].w.push({...answer(q.key).cfg});render();toast(T(`Pinned to ${S.dashes[0].name}`,`已釘選到「${S.dashes[0].name}」`),'viewdash',T('View','查看'))},
  viewdash(){S.dash=0;toastEl.hidden=true;go('dashboards')},
  askshow(a){S.txq=a==='grab'?'Grab':'';S.txf={type:'all',cat:a==='japan'?'dining':a==='subs'?'bills':a==='groceries'?'groceries':'all',cur:a==='japan'?'JPY':'all',src:'all',month:a==='japan'?'2026-09':'all'};go('transactions')},
  story(a){storyGo(Number(a))},storystep(a){storyGo(S.story+Number(a))},
  storyopen(){S.month=prevM(CURM);S.day=null;go('overview')},
  confirm(a){openOv({kind:'confirm',what:a})},
  gmailoff(){S.gmail=false;closeOv();toast(T('Gmail disconnected. No more mail will be read.','已中斷 Gmail 連結，不會再讀取任何郵件。'))},
  dodelete(){S.overlay=null;S.empty=true;S.txEmpty=[];go('landing');toast(T('Account deleted. Nothing about you is stored any more.','帳戶已刪除，不再保存任何關於你的資料。'))},
  copy(){try{navigator.clipboard.writeText('https://financetracker.app/join/kai-7Q2M')}catch(e){}toast(T('Invite link copied','已複製邀請連結'))},
  export(){const rows=[['date','merchant','category','type','amount','currency','amount_sgd','source'],...TX().map(t=>[t.d,t.m,CATS[t.c].en,t.inc?'income':'expense',t.a,t.cur,t.sgd,SRC[t.src][0]])];const csv=rows.map(r=>r.map(x=>/[",\n]/.test(String(x))?`"${String(x).replace(/"/g,'""')}"`:x).join(',')).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='finance-tracker-transactions.csv';a.click();toast(T(`Downloaded ${TX().length} transactions as CSV`,`已下載 ${TX().length} 筆交易（CSV）`))},
  startscan(){S.scan=0;S.gmail=true},skipgmail(){S.gmail=false;S.empty=true;S.txEmpty=[]},
  scandone(a){S.empty=false;S.gmail=true;if(a==='review'){S.impTab='gmail';go('import')}else{go('overview');toast(T('212 transactions added. Change any of them in Transactions.','已加入 212 筆交易，可在交易清單中修改。'))}}
};
function ask(q,key){if(S.aiOut)return;if(!key){const s=q.toLowerCase();key=/japan|日本/.test(s)?'japan':/subscri|bill|訂閱|帳單/.test(s)?'subs':/grab/.test(s)?'grab':/grocer|雜貨|超市/.test(s)?'groceries':'none'}
  S.asks.push({q,key});S.aiLeft=Math.max(0,S.aiLeft-1);if(!S.aiLeft)S.aiOut=true;render()}
function storyGo(i){const tr=document.getElementById('track');if(!tr)return;i=Math.max(0,Math.min(tr.children.length-1,i));tr.scrollTo({left:i*tr.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}

/* ============ events ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(S.menu&&!e.target.closest('.menu')&&!(el&&el.dataset.act==='menu')){S.menu=false;render();if(!el)return}
  if(!el){const sl=e.target.closest('.slide');if(sl&&!e.target.closest('button')){const b=sl.getBoundingClientRect();storyGo(S.story+(e.clientX-b.left<b.width*.3?-1:1))}return}
  if(el.disabled||el.getAttribute('aria-disabled')==='true')return;
  const fn=ACT[el.dataset.act];if(fn)fn(el.dataset.arg,el,e)});
document.addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('askin');if(i&&i.value.trim())ask(i.value.trim())});
document.addEventListener('input',e=>{const el=e.target,on=el.dataset.on;if(!on)return;
  if(on==='txq'){S.txq=el.value;S.txLimit=40;document.getElementById('txlist').innerHTML=txList()}
  else if(on==='txd')S.overlay.draft[el.dataset.arg]=el.value;
  else if(on==='dashname')S.dashes[S.dash].name=el.value;
  else if(on==='delc')document.getElementById('delbtn').disabled=el.value.trim()!=='DELETE'});
document.addEventListener('change',e=>{const el=e.target,on=el.dataset.on;if(!on)return;
  if(on==='cur'){S.cur=el.value;render()}
  else if(on==='txf'){S.txf[el.dataset.arg]=el.value;S.txLimit=40;render()}
  else if(on==='txd'&&el.dataset.arg==='a')render();
  else if(on==='txdc'){S.overlay.draft.cur=el.value;render()}
  else if(on==='txdcat'){S.overlay.draft.c=el.value;render()}
  else if(on==='txpast')S.overlay.past=el.checked;
  else if(on==='cfgperiod'){S.overlay.cfg.period=el.value;render()}
  else if(on==='dashname')render()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&(S.overlay||S.menu)){e.preventDefault();closeOv();return}
  if(S.overlay&&e.key==='Tab'){const f=[...root.querySelectorAll('.scrim a[href],.scrim button:not([disabled]),.scrim input,.scrim select')];if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  if(route()==='review'&&!S.overlay&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!/INPUT|SELECT/.test(e.target.tagName)){e.preventDefault();storyGo(S.story+(e.key==='ArrowRight'?1:-1))}});
/* tooltips: per-mark on bars, bands and cells; crosshair on lines */
function showTip(html,x,y){tipEl.innerHTML=html;tipEl.hidden=false;const b=tipEl.getBoundingClientRect();tipEl.style.left=Math.max(8,Math.min(window.innerWidth-b.width-8,x+14))+'px';tipEl.style.top=Math.max(8,y-b.height-12)+'px'}
document.addEventListener('pointermove',e=>{
  const m=e.target.closest&&e.target.closest('[data-tip]');
  if(m){const[b,r]=m.dataset.tip.split('|');showTip(`<b>${esc(b)}</b>${esc(r)}`,e.clientX,e.clientY);return}
  const sv=e.target.closest&&e.target.closest('svg[data-ch]');
  if(sv){const c=CH[sv.dataset.ch],bx=sv.getBoundingClientRect(),vx=(e.clientX-bx.left)/bx.width*sv.viewBox.baseVal.width,i=Math.max(0,Math.min(c.n-1,Math.round((vx-c.x0)/c.dx))),xh=sv.querySelector('.xh');
    xh.setAttribute('x1',c.x0+i*c.dx);xh.setAttribute('x2',c.x0+i*c.dx);xh.style.opacity=.6;
    showTip(`${esc(c.rows[i].t)}${c.rows[i].v.map((v,k)=>`<b><i class="k" style="background:${c.colors[k]}"></i>${esc(v)} <span style="font-weight:400;opacity:.8">${esc(c.names[k])}</span></b>`).join('')}`,e.clientX,e.clientY);return}
  if(!tipEl.hidden){tipEl.hidden=true;root.querySelectorAll('.xh').forEach(x=>x.style.opacity=0)}});
document.addEventListener('focusin',e=>{const m=e.target.closest&&e.target.closest('[data-tip]');if(m){const[b,r]=m.dataset.tip.split('|'),bx=m.getBoundingClientRect();showTip(`<b>${esc(b)}</b>${esc(r)}`,bx.left,bx.top)}});
document.addEventListener('focusout',()=>{tipEl.hidden=true});
/* dashboard editor: drag to reorder, drag the corner handle to resize */
let dragI=null;
document.addEventListener('dragstart',e=>{const w=e.target.closest&&e.target.closest('.w.edit');if(!w)return;dragI=Number(w.dataset.i);w.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(dragI))}catch(x){}});
document.addEventListener('dragover',e=>{const w=e.target.closest&&e.target.closest('.w.edit');const dz=e.target.closest&&e.target.closest('#drop');if(dz){e.preventDefault();dz.classList.add('over')}if(w&&dragI!=null){e.preventDefault();root.querySelectorAll('.w.over').forEach(x=>x.classList.remove('over'));w.classList.add('over')}});
document.addEventListener('dragleave',e=>{const dz=e.target.closest&&e.target.closest('#drop');if(dz&&!dz.contains(e.relatedTarget))dz.classList.remove('over')});
document.addEventListener('drop',e=>{const dz=e.target.closest&&e.target.closest('#drop');if(dz){e.preventDefault();S.impStage=1;render();return}
  const w=e.target.closest&&e.target.closest('.w.edit');if(w&&dragI!=null){e.preventDefault();const j=Number(w.dataset.i),l=S.dashes[S.dash].w,[x]=l.splice(dragI,1);l.splice(j,0,x)}dragI=null;render()});
document.addEventListener('dragend',()=>{if(dragI!=null){dragI=null;render()}});
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('.w-size');if(!h)return;e.preventDefault();const card=h.closest('.w'),i=Number(h.dataset.size),c=S.dashes[S.dash].w[i],col=document.getElementById('dash').clientWidth/4,w0=card.getBoundingClientRect().width,x0=e.clientX;
  const mv=ev=>{const n=Math.max(1,Math.min(4,Math.round((w0+ev.clientX-x0)/col)));if(n!==c.size){c.size=n;card.className=card.className.replace(/\bs\d\b/,'s'+n)}};
  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);render()};addEventListener('pointermove',mv);addEventListener('pointerup',up)});
addEventListener('hashchange',()=>{S.overlay=null;S.menu=false;render();scrollTo(0,0);const m=document.getElementById('main');m&&m.focus({preventScroll:true})});
let rsT;addEventListener('resize',()=>{clearTimeout(rsT);rsT=setTimeout(render,150)});
if(qs.get('scan'))S.scan=Number(qs.get('scan'));
if(qs.get('ask'))qs.get('ask').split(',').forEach(k=>{const q=ASK_Q().find(x=>x[0]===k);q&&S.asks.push({q:q[1],key:k})});
if(qs.get('month'))S.month=qs.get('month');
render();
if(qs.get('sheet')==='tx')ACT.txedit(DB.tx.find(t=>t.cur==='JPY').id);
if(qs.get('sheet')==='chart')ACT.chartnew();
</script>
</body>
